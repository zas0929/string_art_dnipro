<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Відновлення пароля</title>
  </head>
  <body style="margin:0;padding:0;background:#f0ede7;color:#171a17;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f0ede7;">
      <tr>
        <td align="center" style="padding:24px 12px;">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;background:#ffffff;border:1px solid #d9d2c7;">
            <tr>
              <td style="padding:24px 32px;background:#111712;border-bottom:2px solid #cda975;">
                <div style="color:#ffffff;font-size:20px;line-height:26px;font-weight:700;">String Art Dnipro</div>
                <div style="margin-top:3px;color:#c9c7c0;font-size:13px;line-height:19px;">Картини ниткою за вашим фото</div>
              </td>
            </tr>
            <tr>
              <td style="padding:36px 32px 16px;">
                <h1 style="margin:0 0 14px;color:#171a17;font-size:28px;line-height:35px;font-weight:700;">Створіть новий пароль</h1>
                <p style="margin:0;color:#5f625d;font-size:16px;line-height:25px;">Ми отримали запит на відновлення доступу. Натисніть кнопку нижче, щоб встановити новий пароль.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:14px 32px 34px;">
                <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td bgcolor="#cda975" style="background:#cda975;border:1px solid #b7905b;">
                      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset-password" style="display:inline-block;padding:14px 24px;color:#111510;font-size:16px;line-height:20px;font-weight:700;text-decoration:none;">Відновити пароль</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px;background:#f7f4ee;border-top:1px solid #e1dbd1;color:#73756f;font-size:12px;line-height:19px;">Якщо ви не надсилали запит, проігноруйте цей лист. Ваш пароль залишиться без змін.<br>stringartdnipro.com</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
