<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1310" />
    <title>String Art Dnipro</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
        background: #0f1310;
        color: #f4efe6;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }

      main {
        max-width: 360px;
      }

      img {
        width: 88px;
        height: 88px;
        object-fit: contain;
      }

      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: #aaa9a2;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="logo-white-compact.png" alt="" />
      <h1>String Art Dnipro</h1>
      <p>Для запуску генератора потрібне підключення до інтернету.</p>
    </main>
  </body>
</html>
